name: Bug report
description: 报告叶瞬光桌面宠物的运行问题
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: app-version
    attributes:
      label: 程序版本
      description: 在 EXE 属性的“详细信息”中可以查看版本。
      placeholder: 例如 1.0.1
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true

  - type: input
    id: display
    attributes:
      label: 显示环境
      description: 请填写缩放比例和显示器数量。
      placeholder: 例如 150%，双显示器
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动程序
        2. 打开……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果和截图
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容中不包含密码、API key 或其他私人信息。
          required: true
