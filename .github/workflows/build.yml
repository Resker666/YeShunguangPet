name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify sprite sheet
        shell: pwsh
        run: .\scripts\verify-assets.ps1

      - name: Build
        shell: pwsh
        run: dotnet build .\YeShunguangPet.Wpf.csproj --configuration Release
