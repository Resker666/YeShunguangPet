name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify sprite sheet
        shell: pwsh
        run: .\scripts\verify-assets.ps1

      - name: Build
        shell: pwsh
        run: dotnet build .\YeShunguangPet.Wpf.csproj --configuration Release

      - name: Test skins and companion behavior
        shell: pwsh
        run: dotnet run --project tests/PetTests.csproj --configuration Release -- .

      - name: Test native control center
        shell: pwsh
        run: dotnet run --project tests/PetTests.csproj --configuration Release --no-build -- . artifacts/ui-smoke --ui-smoke

      - name: Timer quality gates
        shell: pwsh
        timeout-minutes: 10
        run: dotnet run --project tests/PetTests.csproj --configuration Release --no-build -- . artifacts/quality --quality

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            artifacts/quality
            artifacts/ui-smoke
          if-no-files-found: ignore
          retention-days: 7
